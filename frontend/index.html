<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI README Generator</title>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Highlight.js Theme (Atom One Dark) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Outfit", "sans-serif"],
              mono: [
                "ui-monospace",
                "SFMono-Regular",
                "Menlo",
                "Monaco",
                "Consolas",
                "Liberation Mono",
                "Courier New",
                "monospace",
              ],
            },
          },
        },
      };
    </script>
    <style>
      /* Smooth scrolling & pleasant scrollbar */
      html {
        scroll-behavior: smooth;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      } /* slate-900 */
      ::-webkit-scrollbar-thumb {
        background-color: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #475569;
      }

      /* Premium gradient background */
      body {
        background: radial-gradient(
          circle at top right,
          #1e1b4b,
          #0f172a 40%,
          #020617
        );
        background-attachment: fixed;
      }

      /* Markdown content styles */
      .markdown-body {
        color: #e2e8f0;
        font-family: "Outfit", sans-serif;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        color: #f8fafc;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        font-weight: 600;
      }
      .markdown-body h1 {
        font-size: 2.25em;
        border-bottom: 1px solid #334155;
        padding-bottom: 0.3em;
      }
      .markdown-body h2 {
        font-size: 1.75em;
        border-bottom: 1px solid #334155;
        padding-bottom: 0.3em;
      }
      .markdown-body h3 {
        font-size: 1.5em;
      }
      .markdown-body p {
        margin-bottom: 1em;
        line-height: 1.7;
      }
      .markdown-body a {
        color: #60a5fa;
        text-decoration: none;
      }
      .markdown-body a:hover {
        text-decoration: underline;
      }
      .markdown-body ul,
      .markdown-body ol {
        margin-bottom: 1em;
        padding-left: 2em;
        list-style-type: disc;
      }
      .markdown-body li {
        margin-bottom: 0.25em;
      }
      .markdown-body blockquote {
        border-left: 4px solid #3b82f6;
        padding-left: 1em;
        color: #94a3b8;
        background: rgba(59, 130, 246, 0.1);
        padding: 0.5em 1em;
        border-radius: 0 0.5em 0.5em 0;
        margin-bottom: 1em;
      }
      .markdown-body code {
        background: #1e293b;
        padding: 0.2em 0.4em;
        border-radius: 0.3em;
        font-size: 0.9em;
        font-family: monospace;
      }
      .markdown-body pre {
        background: #0f172a;
        padding: 1em;
        border-radius: 0.5em;
        overflow-x: auto;
        margin-bottom: 1em;
        border: 1px solid #334155;
      }
      .markdown-body pre code {
        background: none;
        padding: 0;
        font-size: 0.9em;
      }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1em;
      }
      .markdown-body th,
      .markdown-body td {
        border: 1px solid #334155;
        padding: 0.5em 1em;
        text-align: left;
      }
      .markdown-body th {
        background: #1e293b;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.1.1",
          "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
          "react/": "https://esm.sh/react@^19.1.1/",
          "@google/genai": "https://esm.sh/@google/genai@^1.12.0",
          "vite": "https://esm.sh/vite@^7.0.6",
          "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^4.7.0"
        }
      }
    </script>
  </head>
  <body class="text-slate-200 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.jsx"></script>
  </body>
</html>
